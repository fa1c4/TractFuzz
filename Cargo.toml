[workspace]
members = [
    "libaflgo_targets",
    "libaflgo",
    "wrapper/libafl_cc_libs",
    "fuzzers/aflgo",
    "fuzzers/hawkeye",
    "fuzzers/dafl",
    "fuzzers/beacon",
    "fuzzers/beacon_cli",
]
default-members = ["libaflgo_targets", "libaflgo"]
package.rust-version = "1.71"

[workspace.dependencies]
# LibAFL version 0.10.1
libafl = { git = "https://github.com/vusec/LibAFL-directed.git", rev = "55145cae616e8e1d3d1cbc5774294756ed9bbe4b" }
libafl_cc = { git = "https://github.com/vusec/LibAFL-directed.git", rev = "55145cae616e8e1d3d1cbc5774294756ed9bbe4b" }
libafl_targets = { git = "https://github.com/vusec/LibAFL-directed.git", rev = "55145cae616e8e1d3d1cbc5774294756ed9bbe4b" }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
debug = true

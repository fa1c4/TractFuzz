[package]
name = "idfuzz_cli"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true

[dependencies]
clap = { version = "~4.4", features = ["derive"] }
libafl = { workspace = true }
libaflgo = { path = "../../libaflgo" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }

[[bin]]
name = "idfuzz_cli"
path = "src/main.rs"
